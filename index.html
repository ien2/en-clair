function searchHits(q){
  q=q.trim().toLowerCase(); if(!q) return null;
  function has(){ return Array.prototype.slice.call(arguments).join(" ").toLowerCase().indexOf(q)>=0; }
  var out=[];
  USAGES.forEach(function(x){ if(has(x.t,x.intro,(x.doo||[]).join(" "),(x.ifh||[]).join(" "),(x.signals||[]).join(" "),(x.talk||[]).join(" "))) out.push({ref:"u:"+x.id,t:x.t,k:"Situation"}); });
  Object.keys(GUIDES).forEach(function(id){ var G=GUIDES[id]; if(has(G.t,G.why,G.steps.map(function(s){return s[1];}).join(" "),(G.limits||[]).join(" "))) out.push({ref:"g:"+id,t:G.t,k:"Guide"}); });
  FAQ.forEach(function(f,i){ if(has(f[0],f[1])) out.push({ref:"faq:"+i,t:f[0],k:"FAQ"}); });
  LEX.forEach(function(l){ if(has(l.t,l.d,l.v.join(" "))) out.push({ref:"lex:"+l.id,t:l.t,k:"Lexique"}); });
  allItems().forEach(function(it){ if(has(it.name,it.what||"",(it.risks||[]).join(" "),(it.settings||[]).join(" "),it.ctl||"")) out.push({ref:"i:"+it.id,t:it.name,k:"Fiche"}); });
  HELP.forEach(function(h){ if(has(h.n,h.d)) out.push({ref:"h",t:h.n+" : "+h.d,k:"Aide"}); });
  return out;
}

}

var FAQ=[
 ["À partir de quel âge un premier téléphone ?","Il n'y a pas d'âge idéal : c'est le besoin qui décide (trajets seul, activités). Beaucoup de familles commencent par un téléphone simple, puis un smartphone préparé à l'avance avec le contrôle parental, peu d'apps, et une règle claire pour la nuit.","premier-telephone"],
 ["Combien de temps d'écran par jour ?","Il n'existe pas de chiffre magique. Mieux vaut regarder ce que l'écran remplace (sommeil, sport, amis, devoirs) et comment l'enfant se sent après. Pas d'écran le matin avant l'école, aux repas et une heure avant de dormir sont des repères simples.","temps-ecran"],
 ["Faut-il lire les messages de son enfant ?","La supervision montre avec qui il échange, pas le contenu. Lire en cachette abîme la confiance. Mieux vaut convenir ensemble de ce que vous pouvez voir, et dire que vous le faites. En cas de danger, c'est différent : on agit.","reseaux-sociaux"],
 ["Mon enfant veut un réseau social avant l'âge minimum, que faire ?","L'âge fixé par l'app n'est pas une simple formalité : en dessous, l'enfant ne bénéficie pas des protections prévues et ment sur sa date de naissance. Si vous dites oui, faites-le ensemble, avec la vraie date, un compte privé et la supervision.","reseaux-sociaux"],
 ["Plusieurs outils de contrôle se contredisent, est-ce grave ?","Ce n'est pas un problème si chaque outil a son rôle : par exemple l'un pour le temps, l'autre pour le filtrage. Le risque, ce sont des règles en double qui bloquent tout ou se contournent. Dans Jiminy, cochez « Choix assumé » quand vous gardez volontairement une configuration.",""],
 ["Il a contourné le contrôle parental, je fais quoi ?","D'abord comprendre : est-ce une règle trop stricte, un besoin réel, un défi ? Corrigez la faille (autre navigateur, compte invité, VPN), puis rediscutez la règle. Punir sans parler pousse à mieux cacher la prochaine fois.","contournement"],
 ["Il a reçu une image choquante, comment réagir ?","Remercier d'en avoir parlé, ne pas punir, ne pas confisquer le téléphone dans l'instant. Faire une capture si besoin, signaler, bloquer. Revenir dessus le lendemain. Si c'est un adulte qui l'envoie, signalez-le sur Pharos ou au 3018.","contenus-choquants"],
 ["Quelqu'un fait du chantage à mon enfant avec une photo ?","Ne pas payer, ne plus répondre, garder les preuves (captures), bloquer, et appeler le 3018 qui aide à faire retirer les images. Rappelez à votre enfant qu'il est la victime, jamais le fautif.","images-chantage"],
 ["Les jeux en ligne sont-ils dangereux ?","Les jeux eux-mêmes non, mais les discussions avec des inconnus et les achats intégrés oui. Vérifiez le PEGI, coupez ou limitez le chat vocal, exigez l'accord parental pour les achats et jouez de temps en temps avec lui.","jeux-en-ligne"],
 ["Le téléphone doit-il dormir hors de la chambre ?","C'est la règle la plus utile pour le sommeil : notifications, envie de répondre et lumière de l'écran repoussent l'endormissement. Un chargeur commun dans le salon la rend plus facile à tenir, pour les parents aussi.","sommeil"],
 ["Et quand les règles diffèrent entre deux maisons ?","Mettez-vous d'accord sur l'essentiel (nuit, âge des réseaux, achats) plutôt que sur tout. Jiminy peut être partagé : une sauvegarde exportée et reprise dans l'autre foyer donne les mêmes repères.","deux-maisons"],
 ["Mon enfant utilise une IA pour ses devoirs, est-ce un problème ?","L'IA peut aider à comprendre, à réviser ou à s'entraîner. Le problème, c'est quand elle fait le travail à sa place ou qu'on la croit sur parole. Demandez-lui de vous montrer comment il l'utilise.","ia-devoirs"],
 ["Que faire si un compte est piraté ?","Changer le mot de passe depuis un appareil sûr, activer la double authentification, déconnecter les autres appareils, prévenir les contacts. Si l'accès est perdu, passer par la procédure de récupération de la plateforme.","arnaques"],
 ["Comment Jiminy calcule-t-il le score ?","Il combine les réglages faits ou assumés, les essentiels de l'âge de chaque enfant, votre plan de mise en place et les réponses au dernier point numérique en famille. Le score sert à voir les progrès, pas à juger.",""]
];
function lexById(id){ return LEX.filter(function(l){return l.id===id;})[0]; }
var _lexRe=null;
function lexRe(){ if(_lexRe) return _lexRe; var vs=[]; LEX.forEach(function(l){ l.v.forEach(function(v){ vs.push([v,l.id]); }); }); vs.sort(function(a,b){return b[0].length-a[0].length;});
  _lexRe={re:new RegExp("(^|[^\\p{L}\\d])("+vs.map(function(v){return v[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/'/g,"(?:'|&#39;|’)");}).join("|")+")(?![\\p{L}\\d])","giu"),map:vs}; return _lexRe; }
function gloss(html){
  if(!html) return html; var L=lexRe(), seen={};
  return html.replace(L.re,function(m,pre,w){ var key=w.toLowerCase().replace(/&#39;|’/g,"'"); var hit=L.map.filter(function(v){return v[0].toLowerCase()===key;})[0]; if(!hit||seen[hit[1]]) return m; seen[hit[1]]=1; return pre+'<button type="button" class="term" data-act="term" data-t="'+hit[1]+'">'+w+'</button>'; });
}

function download(name, text, type){
  var blob=new Blob([text],{type:type}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function doExportLib(){
  var base=window.EC_LIB||{items:[],icons:{}}, items=(base.items||[]).slice(), byId={};
  items.forEach(function(x,i){ byId[x.id]=i; });
  var put=function(x){ if(byId[x.id]!=null) items[byId[x.id]]=Object.assign({},items[byId[x.id]],x); else { byId[x.id]=items.length; items.push(x); } };
  (S.custom||[]).forEach(function(c){ var y=Object.assign({},c); delete y.custom; put(y); });
  Object.keys(S.libEdits||{}).forEach(function(id){ put(Object.assign({id:id},S.libEdits[id])); });
  (S.libRemoved||[]).forEach(function(id){ put({id:id,removed:true}); });
  var icons=Object.assign({},base.icons||window.EC_ICONS||{},S.icons||{});
  var lib={version:todayISO(),items:items,icons:icons};
  download("bibliotheque.js","/* Bibliothèque de Jiminy : éléments ajoutés ou corrigés, et icônes. Généré depuis Jiminy le "+todayISO()+". Les logos appartiennent à leurs propriétaires et ne servent qu'à identifier les applications. */\nwindow.EC_LIB="+JSON.stringify(lib)+";\n","text/javascript");
  UI.libMsg2="Fichier bibliotheque.js téléchargé. Déposez-le sur GitHub pour mettre le site à jour."; render();
}

function readImport(file){
  var r=new FileReader();
  r.onload=function(){
    try {
      var j=JSON.parse(r.result); var d=j&&j.data;
      if(j && j.app==="vie-numerique-famille" && j.kind==="catalogue" && Array.isArray(j.custom)){ var nAdd=0; j.custom.forEach(function(c){ if(c&&c.id&&c.name&&!item(c.id)){ c.custom=true; S.custom.push(c); nAdd++; } }); S.icons=Object.assign({}, j.icons||{}, S.icons||{}); save(); UI.msg=nAdd?plural(nAdd,"élément")+" ajouté"+(nAdd>1?"s":"")+" à votre liste.":"Ces éléments étaient déjà dans votre liste."; location.hash="#sauvegarde"; render(); return; }
      if(!j || j.app!=="vie-numerique-famille" || !d || !Array.isArray(d.kids)) throw new Error("format");
      UI.pendingImport={name:file.name,data:d}; UI.msg="";
      if(!S.onboarded){ applyImport("replace"); return; }
      location.hash="#sauvegarde"; render();
    } catch(e){ UI.msg="Ce fichier n'est pas une sauvegarde de cet outil."; render(); }
  };
  r.readAsText(file);

function applyImport(mode){
  var d=UI.pendingImport.data;
  if(mode==="replace"){ S=Object.assign(blank(), d); S.onboarded=true; }
  else {
    d.kids.forEach(function(k){ if(!kid(k.id)) S.kids.push(k); });
    Object.keys(d.use||{}).forEach(function(i){ S.use[i]=Object.assign({}, d.use[i], S.use[i]||{}); });
    (d.custom||[]).forEach(function(c){ if(!item(c.id)) S.custom.push(c); });
    Object.assign(S.checks, d.checks||{}); S.icons=Object.assign({}, d.icons||{}, S.icons||{}); Object.assign(S.topics, d.topics||{});
    (d.journal||[]).forEach(function(e){ if(!S.journal.some(function(x){return x.id===e.id;})) S.journal.push(e); });
  }
  UI.pendingImport=null; UI.msg="Sauvegarde reprise."; save(); location.hash="#accueil"; render();

document.addEventListener("change", function(ev){
  var t=ev.target, ds=t.dataset||{};

  if(ds.iconFor){ if(t.files&&t.files[0]) setIcon(ds.iconFor,t.files[0]); return; }
  if(t.id==="import-file"){ if(t.files&&t.files[0]) readImport(t.files[0]); return; }
  if(ds.kfield){ var kk=kid(ds.kid); if(kk){ if(ds.kfield==="name"){ kk.name=t.value.trim(); save(); } else { kk[ds.kfield]=t.value?+t.value:""; rerender(); } } return; }
  if(ds.status){ UI.accOpen=ds.kid+":"+ds.item; setU(ds.item,ds.kid,{s:t.value, ok: t.value==="utilise"?u(ds.item,ds.kid).ok:false}); render(); return; }
  if(ds.ok){ setU(ds.item,ds.kid,{ok:t.checked}); render(); return; }
  if(ds.note){ setU(ds.item,ds.kid,{note:t.value.trim()}); return; }
  if(ds.set!=null && ds.item){ var sit=item(ds.item), sk=kid(ds.kid); if(sit&&sk){ var sd=setsOf(sit,sk).d.filter(function(v){return v!==+ds.set;}); if(t.checked) sd.push(+ds.set); setU(ds.item,ds.kid,{set:sd}); var rr=setsOf(sit,sk); setU(ds.item,ds.kid,{ok:rr.n===rr.t}); render(); } return; }
  if(ds.uf){ var pp={}; pp[ds.uf]=t.value.trim(); setU(ds.item,ds.kid,pp); if(t.tagName==="SELECT") render(); return; }
  if(ds.via){ var cv=(u(ds.item,ds.kid).via||[]).filter(function(v){return v!==ds.via;}); if(t.checked) cv.push(ds.via); setU(ds.item,ds.kid,{via:cv}); render(); return; }
  if(ds.check){ if(t.checked) S.checks[ds.check]=true; else delete S.checks[ds.check]; rerender(); return; }
  if(ds.topic){ if(t.checked) S.topics[ds.topic]=true; else delete S.topics[ds.topic]; rerender(); return; }
  if(t.id==="family"){ S.family=t.value.trim(); rerender(); return; }
  if(t.id==="as-site"){ UI.as.site=t.value; renderDialog(); return; }
});
